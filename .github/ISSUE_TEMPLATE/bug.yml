name: Bug report
description: Something in a design, the firmware or the software does not work as it should.
type: Bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before you report, check the product's manual at [docs.source-robotics.com](https://docs.source-robotics.com/);
        most manuals have a Known issues page. Questions go to
        [Discussions](https://github.com/orgs/Source-Robotics/discussions).
  - type: dropdown
    id: product
    attributes:
      label: Which product?
      options:
        - PAROL6
        - PAR6 (beta)
        - SSG-48 gripper
        - MSG gripper
        - STEPFOC driver
        - Spectral Micro driver
        - CANvas adapter
        - Other or software
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Firmware and software versions, if you know them.
      placeholder: "e.g. firmware 108, Python API 0.9.1"
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: Photos, logs or screenshots
      description: Drag them in here. Paste logs as text.
    validations:
      required: false
